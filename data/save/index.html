<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="index.css">
</head>
<body>
  <form action="#" autocomplete="off">
    <label>URL
      <div class="row">
        <input type="text" name="url">
        <button type="button" data-cmd="trim" title="Strip path, keep origin">Clean</button>
        <button type="button" data-cmd="domain" title="Reduce to bare domain">Domain</button>
      </div>
    </label>

    <label>Submit URL
      <div class="row">
        <input type="text" name="submiturl">
        <button type="button" data-cmd="trim">Clean</button>
        <button type="button" data-cmd="domain">Domain</button>
      </div>
    </label>

    <label>Login
      <input type="text" name="login" autocomplete="new-password" required>
    </label>

    <label>Password
      <div class="row">
        <input type="password" name="password" autocomplete="new-password" required>
        <button type="button" data-cmd="toggle" data-type="password" title="Show / hide">👁</button>
        <button type="button" data-cmd="generate" title="Generate a password">⚙</button>
      </div>
    </label>

    <div id="gen-panel" hidden>
      <div class="row gen-row">
        <select name="gen-mode">
          <option value="charset">Charset</option>
          <option value="diceware" selected>Diceware</option>
        </select>
        <button type="button" data-cmd="gen-go" class="primary">Generate</button>
        <button type="button" data-cmd="gen-close" title="Close panel">✕</button>
      </div>
      <div class="gen-fields" data-mode="diceware">
        <label>Words <input type="number" name="dw-count" min="3" max="12" value="5"></label>
        <label>Separator <input type="text" name="dw-sep" value="-" maxlength="3"></label>
        <label class="check"><input type="checkbox" name="dw-cap" checked> Capitalize</label>
        <label>Digits <input type="number" name="dw-digits" min="0" max="6" value="1"></label>
        <label>Symbols <input type="number" name="dw-symbols" min="0" max="6" value="1"></label>
      </div>
      <div class="gen-fields" data-mode="charset" hidden>
        <label>Letters/digits <input type="number" name="cs-len1" min="0" max="64" value="14"></label>
        <label>Symbols <input type="number" name="cs-len2" min="0" max="16" value="3"></label>
      </div>
    </div>

    <div class="actions">
      <button type="button" data-cmd="cancel">Close</button>
      <button type="button" data-cmd="reset">Reset</button>
      <span class="spacer"></span>
      <span class="save-in">Save in</span>
      <button type="submit" data-cmd="ssdb" title="Encrypted Chrome sync storage (AES-256). Independent of any KeePass database.">SSDB</button>
      <button type="submit" data-cmd="keepass" class="primary" title="Save in the connected KeePass/KeePassXC database">KeePass</button>
    </div>
  </form>
  <script src="session.js"></script>
  <script src="/tools/safe.js"></script>
  <script src="/connect/SecureSyncedDB.js"></script>
  <script src="/tools/tld.js"></script>
  <script src="/tools/diceware-words.js"></script>
  <script src="/tools/password-gen.js"></script>
  <script src="/connect/api.js"></script>
  <script src="/connect/keepass/keepass.js"></script>
  <script src="/connect/keepassxc/nacl-fast.min.js"></script>
  <script src="/connect/keepassxc/keepassxc.js"></script>
  <script src="/connect/kdbxweb/kdbxweb.js"></script>
  <script src="/connect/kdbxweb/connect.js"></script>
  <script src="index.js"></script>
</body>
</html>
